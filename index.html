<h3>Admin Panel</h3>
<input type="text" id="adminUsername" placeholder="Admin Username">
<input type="password" id="adminPassword" placeholder="Admin Password">
<button class="btn-admin" onclick="adminLogin()">Login as Admin</button>
</div>

<!-- Admin Section -->
<div class="section" id="adminSection">
<h3>Add Balance to User</h3>
<input type="text" id="adminRefCode" placeholder="User Ref Code">
<input type="number" id="adminAmount" placeholder="Amount">
<button class="btn-admin" onclick="addBalance()">Add Balance</button>
</div>

<!-- Deposit Modal -->
<div id="depositModalOverlay">
<div id="depositModal">
<h3>Send Money to 01956715958 via bKash/Nagad</h3>
<p>Amount: <span id="depositAmountDisplay"></span> Taka</p>
<label>Enter Transaction ID</label>
<input type="text" id="trxId" placeholder="Enter Transaction ID">
<button class="btn-primary" onclick="submitDeposit()">Submit</button>
<button class="btn-admin" style="margin-top:10px;" onclick="closeDepositModal()">Close</button>
<p id="depositMsg" style="color:green;"></p>
</div>
</div>

<script>
// User info
let user = { balance:0, dailyClaimed:false, lastCheckin:null, refCode:Math.random().toString(36).substring(2,8), refBonus:0, referrals:0, firstDepositDone:false };
let userTransactions = [];

// Update balance & transaction table
function updateBalance(){
  document.getElementById('balance').innerText = user.balance.toFixed(2);
  document.getElementById('refBonus').innerText = user.refBonus.toFixed(2);
  document.getElementById('refCount').innerText = user.referrals;
  updateUserTxTable();
}
function updateUserTxTable(){
  const tbody = document.getElementById('userTxTable');
  tbody.innerHTML='';
  for(let tx of userTransactions){
    const tr = document.createElement('tr');
    tr.innerHTML=`<td>${tx.time}</td><td>${tx.type}</td><td>${tx.amount.toFixed(2)}</td><td>${tx.detail}</td>`;
    tbody.appendChild(tr);
  }
}

// Deposit Modal
function openDepositModal(){ 
  let amount = document.getElementById('depositAmount').value;
  document.getElementById('depositAmountDisplay').innerText = amount;
  document.getElementById('depositModalOverlay').style.display='flex'; 
}
function closeDepositModal(){ 
  document.getElementById('depositModalOverlay').style.display='none';
  document.getElementById('trxId').value=''; 
  document.getElementById('depositMsg').innerText=''; 
}
function submitDeposit(){
  let amount = parseFloat(document.getElementById('depositAmount').value);
  let trx = document.getElementById('trxId').value.trim();
  if(!trx){ alert("Enter Transaction ID"); return; }
  user.balance += amount;
  user.firstDepositDone = true;
  addTransaction('Deposit', amount, 'Txn ID: '+trx);
  closeDepositModal();
  updateBalance();
  alert(`Deposit added: ${amount.toFixed(2)} Taka`);
}

// Daily Income
function claimDailyIncome(){
  if(user.dailyClaimed){ alert("Already claimed!"); return; }
  if(!user.firstDepositDone){ alert("Deposit first"); return; }
  let dailyIncome = parseFloat(document.getElementById('depositAmount').value)*0.2;
  user.balance += dailyIncome;
  addTransaction('Daily Income', dailyIncome, '20% of deposit');
  user.dailyClaimed = true;
  updateBalance();
  alert(`Daily income added: ${dailyIncome.toFixed(2)} Taka`);
}

// Check-in Bonus
function claimCheckinBonus(){
  let today = new Date().toDateString();
  if(user.lastCheckin===today){ alert("Already claimed"); return; }
  if(user.balance>0){
    let bonus = user.balance*0.1;
    user.balance += bonus;
    user.lastCheckin=today;
    addTransaction('Check-in Bonus', bonus, '10% of balance');
    updateBalance();
    alert(`Check-in bonus added: ${bonus.toFixed(2)} Taka`);
  } else { alert("Deposit first"); }
}

// Referral
document.getElementById('refLink').value=window.location.href.split("?")[0]+"?ref="+user.refCode;
function copyRef(){
  let refInput=document.getElementById('refLink');
  refInput.select(); refInput.setSelectionRange(0,99999);
  document.execCommand("copy");
  alert("Referral link copied!");
}

// Transactions
function addTransaction(type, amount, detail){
  let time = new Date().toLocaleString();
  userTransactions.push({time,type,amount,detail});
  updateUserTxTable();
}

// Admin login
function adminLogin(){
  const username = document.getElementById('adminUsername').value.trim();
  const password = document.getElementById('adminPassword').value.trim();
  if(username==='admin' && password==='Tasnia91223'){
    alert("Admin login successful!");
    document.getElementById('adminSection').style.display='block';
  } else {
    alert("Admin login failed!");
    document.getElementById('adminSection').style.display='none';
  }
}

// Admin add balance
function addBalance(){
  let ref = document.getElementById('adminRefCode').value.trim();
  let amt = parseFloat(document.getElementById('adminAmount').value);
  if(!ref || !amt){ alert("Enter all fields"); return; }
  if(ref===user.refCode){
    user.balance += amt;
    addTransaction('Admin Add', amt, 'Admin added balance');
    updateBalance();
    alert(`Balance added: ${amt.toFixed(2)} Taka`);
  } else {
    alert("User not found in demo");
  }
}

</script>

</body>
</html>
